  <link rel="stylesheet" href="display-font.css" />
  <style>
    :root { --color-paper:#F4F5F8; --color-ink:#171619; --color-primary:#D93E6A; --color-secondary:#4766B0; --color-accent:#EF7832; --color-atmosphere-lilac:#C5B8D6; --color-atmosphere-blue:#B4C7D9; --color-atmosphere-pink:#DDB9C5; --color-atmosphere-butter:#EBD9A4; --color-atmosphere-apricot:#F2B07F; --font-heading:"Salute",Georgia,serif; --font-body:"Figtree",Arial,sans-serif; --type-heading-xxs:1.5rem; --type-heading-xs:1.875rem; --type-heading-sm:2.5rem; --type-heading-xxs-line-height:1.18; --type-heading-xs-line-height:1.16; --type-heading-sm-line-height:1.15; }

    .quote-callout__stage { position:relative; z-index:0; display:grid; align-items:center; min-height:var(--quote-stage-height); font-size:var(--quote-size); }
    .quote-callout__field { position:absolute; top:50%; left:50%; width:var(--quote-field-width); height:var(--quote-field-height); transform:translate(-50%,-50%); background:color-mix(in srgb,var(--quote-field-color) 25%,transparent); pointer-events:none; }

    .quote-callout--default { --quote-size:clamp(1.75rem,2.5vw,2.45rem); --quote-field-height-multiplier:1.5; max-width:44rem; }.quote-callout--default .quote-callout__quote { text-align:left; }
    .quote-callout--default .quote-callout__stage { width:108%; margin-left:-8%; }.quote-callout--default .quote-callout__content { width:92.5926%; margin-left:7.4074%; }.quote-callout--default .quote-callout__field { left:0; right:auto; transform:translateY(-50%); }
    .quote-callout--wide { --quote-field-height-multiplier:1.5; max-width:62rem; }.quote-callout--wide .quote-callout__field { left:50%; right:auto; transform:translate(-50%,-50%); }.quote-callout--wide .quote-callout__quote,.quote-callout--wide .quote-callout__meta { text-align:center; }.quote-callout--wide .quote-callout__divider { margin-inline:auto; }
    .quote-callout--hero { --quote-size:clamp(2.5rem,4vw,5rem); --quote-field-height-multiplier:1.5; max-width:78rem; }.quote-callout--hero .quote-callout__field { left:50%; right:auto; transform:translate(-50%,-50%); }.quote-callout--hero .quote-callout__quote { text-align:center; }.quote-callout--hero .quote-callout__meta { text-align:center; }.quote-callout--hero .quote-callout__divider { margin-inline:auto; }
    .quote-callout--type-xxs { --quote-size:var(--type-heading-xxs); --quote-line-height:var(--type-heading-xxs-line-height); }.quote-callout--type-xs { --quote-size:var(--type-heading-xs); --quote-line-height:var(--type-heading-xs-line-height); }.quote-callout--type-s { --quote-size:var(--type-heading-sm); --quote-line-height:var(--type-heading-sm-line-height); }
    .quote-callout--debug .quote-callout__stage { outline:1px dashed color-mix(in srgb,var(--color-secondary) 55%,transparent); outline-offset:4px; }.quote-callout--debug .quote-callout__field { outline:1px solid color-mix(in srgb,var(--color-primary) 85%,transparent); }

    /* Prototype Controls */
    .lab { min-height:100vh; padding:clamp(1.25rem,3vw,3rem); }.lab__header { max-width:1440px; margin:0 auto 2rem; padding-bottom:1.25rem; border-bottom:1px solid color-mix(in srgb,var(--color-ink) 22%,transparent); }
    .eyebrow,.control-label,.code-heading { margin:0; color:var(--color-primary); font-size:.72rem; font-weight:600; letter-spacing:.13em; line-height:1.3; text-transform:uppercase; }.lab__title { margin:.3rem 0 0; font-family:var(--font-heading); font-size:clamp(2.15rem,4vw,3.5rem); font-weight:400; letter-spacing:-.035em; line-height:1; }
    .lab__grid { display:grid; grid-template-columns:minmax(17rem,22rem) minmax(0,1fr); align-items:stretch; gap:clamp(2rem,5vw,5rem); max-width:1440px; margin:0 auto; }.controls { min-width:0; }.control-group { margin:0; padding:.65rem 0; border:0; }.control-group--composition { margin-top:.65rem; padding-top:1rem; border-top:1px solid color-mix(in srgb,var(--color-ink) 20%,transparent); }.control-label { display:block; padding:0; margin-bottom:.45rem; color:var(--color-ink); }

    .swatches { display:flex; flex-wrap:wrap; gap:.35rem; }.swatch { min-width:0; padding:.5rem .55rem; border:1px solid transparent; border-radius:0; background:var(--swatch-color); color:var(--color-ink); font:500 .72rem/1.1 var(--font-body); text-align:center; white-space:nowrap; cursor:pointer; }.swatch:hover { border-color:color-mix(in srgb,var(--color-ink) 48%,transparent); }.swatch[aria-pressed="true"] { border-color:var(--color-ink); box-shadow:inset 0 0 0 1px var(--color-ink); font-weight:600; }.swatch:focus-visible { outline:2px solid var(--color-secondary); outline-offset:2px; }
    .boolean-control,.debug-control { display:flex; align-items:center; gap:.55rem; color:var(--color-ink); font-size:.75rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }.boolean-control input,.debug-control input { width:1rem; height:1rem; margin:0; accent-color:var(--color-primary); }
    .code-section { max-width:1440px; margin:clamp(2rem,5vw,5rem) auto 0; padding-top:1.25rem; border-top:1px solid color-mix(in srgb,var(--color-ink) 20%,transparent); }.code-heading { margin-bottom:.7rem; }.code-output { max-height:26rem; margin:0; padding:1rem; overflow:auto; background:#1d1c1f; color:#f7f4f0; font:.77rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }.copy-actions { display:flex; flex-wrap:wrap; gap:.65rem; margin-top:.7rem; }.copy-button { padding:.66rem .9rem; border:1px solid var(--color-ink); border-radius:0; background:transparent; color:var(--color-ink); font:600 .72rem/1.1 var(--font-body); letter-spacing:.1em; cursor:pointer; }.copy-button:hover { background:var(--color-ink); color:var(--color-paper); }.copy-button:focus-visible { outline:2px solid var(--color-secondary); outline-offset:3px; }
    .preview { display:grid; min-width:0; min-height:0; place-items:center; padding:clamp(2.5rem,8vw,8rem) clamp(1rem,6vw,5rem); background:#fff; }.preview__frame { width:100%; }.preview__label { margin:0 0 2.5rem; color:color-mix(in srgb,var(--color-ink) 54%,transparent); font-size:.72rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase; }.preview .quote-callout { margin-inline:auto; }
    @media (max-width:800px) { .lab__grid { grid-template-columns:1fr; }.preview { order:-1; }.controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:1.5rem; }.control-group:first-child,.control-group:nth-child(2),.code-section { grid-column:1 / -1; } }
    @media (max-width:479px) { .lab { padding:1rem; }.controls { display:block; }.preview { padding:2.5rem 1rem; }.quote-callout { --quote-size:clamp(1.75rem,9.3vw,2.35rem); }.quote-callout--default .quote-callout__field { left:-8%; }.quote-callout--hero { --quote-size:clamp(1.75rem,9.3vw,2.35rem); }.quote-callout__mark { font-size:2.9em; }.quote-callout__divider { margin-top:1.3rem; } }
  </style>
</head>
<body>
  <main class="lab">
    <header class="lab__header"><p class="eyebrow">Component lab · standalone prototype</p><h1 class="lab__title">Quote Callout</h1></header>
    <div class="lab__grid">
      <section class="controls" aria-label="Quote callout controls">
        <div class="control-group"><label class="control-label" for="quote-input">Quote text</label><textarea class="quote-input" id="quote-input">My ultimate goal was the Summer Diary. I have the caption, the photo, and the structure all in one place.</textarea></div>
        <div class="control-group"><label class="control-label" for="attribution-input">Attribution</label><input class="attribution-input" id="attribution-input" value="PARTICIPANT INTERVIEW · SUMMER QUEST" /></div>
        <fieldset class="control-group control-group--composition"><legend class="control-label">Size</legend><div class="segment"><input id="size-default" name="size" type="radio" value="default" /><label for="size-default">Default</label><input id="size-wide" name="size" type="radio" value="wide" checked /><label for="size-wide">Wide</label><input id="size-hero" name="size" type="radio" value="hero" /><label for="size-hero">Hero</label></div><p class="control-hint" id="size-description">Major research finding or stronger narrative beat.</p></fieldset>
        <fieldset class="control-group"><legend class="control-label">Font size</legend><div class="segment"><input id="type-xxs" name="type" type="radio" value="xxs" /><label for="type-xxs">XXS</label><input id="type-xs" name="type" type="radio" value="xs" checked /><label for="type-xs">XS</label><input id="type-s" name="type" type="radio" value="s" /><label for="type-s">S</label></div></fieldset>
        <fieldset class="control-group"><legend class="control-label">Rectangle width</legend><div class="segment"><input id="field-width-25" name="field-width" type="radio" value="25" /><label for="field-width-25">25%</label><input id="field-width-35" name="field-width" type="radio" value="35" /><label for="field-width-35">35%</label><input id="field-width-50" name="field-width" type="radio" value="50" checked /><label for="field-width-50">50%</label></div></fieldset>
        <div class="control-group"><label class="boolean-control"><input id="show-mark" type="checkbox" checked /> <span>Show quotation mark</span></label></div>
        <section class="control-group" aria-labelledby="color-label"><h2 class="control-label" id="color-label">Background</h2><div class="swatches" id="swatches" role="group" aria-labelledby="color-label"></div></section>
        <div class="control-group"><label class="debug-control"><input id="show-field-bounds" type="checkbox" /> <span>Show field bounds</span></label></div>
      </section>
      <section class="preview" aria-label="Live quote callout preview"><div class="preview__frame"><p class="preview__label">Live preview</p><div id="preview"></div></div></section>
    </div>
    <section class="code-section" aria-labelledby="code-heading"><h2 class="code-heading" id="code-heading">Component code</h2><pre class="code-output"><code id="code-output"></code></pre><div class="copy-actions"><button class="copy-button" id="copy-code" type="button">Copy code</button><button class="copy-button" id="copy-text" type="button">Copy text only</button></div></section>
  </main>
  <script>
    const colors = [
      { name:'Lilac', variable:'--color-atmosphere-lilac', markVariable:'--color-primary', value:'#C5B8D6' }, { name:'Blue', variable:'--color-atmosphere-blue', markVariable:'--color-secondary', value:'#B4C7D9' }, { name:'Pink', variable:'--color-atmosphere-pink', markVariable:'--color-primary', value:'#DDB9C5' }, { name:'Butter', variable:'--color-atmosphere-butter', markVariable:'--color-accent', value:'#EBD9A4' }, { name:'Apricot', variable:'--color-atmosphere-apricot', markVariable:'--color-accent', value:'#F2B07F' }
    ];
    const quoteInput = document.querySelector('#quote-input'), attributionInput = document.querySelector('#attribution-input'), preview = document.querySelector('#preview'), output = document.querySelector('#code-output'), swatches = document.querySelector('#swatches'); let selectedColor = colors[4], contentObserver;
    const escapeHtml = value => value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    function state() { return { quote:quoteInput.value.trim(), attribution:attributionInput.value.trim(), size:document.querySelector('input[name="size"]:checked').value, type:document.querySelector('input[name="type"]:checked').value, fieldWidth:document.querySelector('input[name="field-width"]:checked').value, hasMark:document.querySelector('#show-mark').checked }; }
    /* Retired generated-style export; it prevented the lab script from parsing.
    function componentStyles() { return `<style>\n.quote-callout {\n  --quote-field-height: 0px;\n  --quote-stage-height: 0px;\n  --quote-field-height-multiplier: 1.5;\n  --quote-size: var(--type-heading-xs);\n  --quote-line-height: var(--type-heading-xs-line-height);\n  position: relative;\n  isolation: isolate;\n  width: 100%;\n  color: var(--color-ink);\n}\n.quote-callout__stage { position: relative; display: grid; align-items: center; min-height: var(--quote-stage-height); font-size: var(--quote-size); }\n.quote-callout__field { position: absolute; top: 50%; left: 50%; width: var(--quote-field-width); height: var(--quote-field-height); transform: translate(-50%, -50%); background: color-mix(in srgb, var(--quote-field-color) 25%, transparent); pointer-events: none; }\n.quote-callout__mark { position: absolute; z-index: 2; top: 0; left: 50%; margin: 0; transform: translate(-50%, -5%); color: var(--quote-mark-color); font-family: var(--font-heading); font-size: 3.15em; font-weight: 400; line-height: .7; white-space: nowrap; }\n.quote-callout__content { position: relative; z-index: 1; }\n.quote-callout__quote { margin: 0; font-family: var(--font-heading); font-size: 1em; font-weight: 400; letter-spacing: -.035em; line-height: var(--quote-line-height); }\n.quote-callout__divider { width: 5.4rem; margin-top: 1.75rem; border-top: 1px solid color-mix(in srgb, var(--color-ink) 60%, transparent); }\n.quote-callout__meta { margin-top: .75rem; font-size: .75rem; font-weight: 600; letter-spacing: .12em; line-height: 1.35; text-transform: uppercase; }\n.quote-callout--default { max-width: 44rem; }\n.quote-callout--default .quote-callout__quote { text-align: left; }\n.quote-callout--default .quote-callout__stage { width: 108%; margin-left: -8%; }\n.quote-callout--default .quote-callout__content { width: 92.5926%; margin-left: 7.4074%; }\n.quote-callout--default .quote-callout__field { left: 0; right: auto; transform: translateY(-50%); }\n.quote-callout--wide { max-width: 62rem; }\n.quote-callout--wide .quote-callout__field, .quote-callout--hero .quote-callout__field { left: 50%; right: auto; transform: translate(-50%, -50%); }\n.quote-callout--wide .quote-callout__quote, .quote-callout--wide .quote-callout__meta, .quote-callout--hero .quote-callout__quote, .quote-callout--hero .quote-callout__meta { text-align: center; }\n.quote-callout--wide .quote-callout__divider, .quote-callout--hero .quote-callout__divider { margin-inline: auto; }\n.quote-callout--hero { max-width: 78rem; }\n.quote-callout--type-xxs { --quote-size: var(--type-heading-xxs); --quote-line-height: var(--type-heading-xxs-line-height); }\n.quote-callout--type-xs { --quote-size: var(--type-heading-xs); --quote-line-height: var(--type-heading-xs-line-height); }\n.quote-callout--type-s { --quote-size: var(--type-heading-sm); --quote-line-height: var(--type-heading-sm-line-height); }\n@media (max-width: 479px) { .quote-callout--default .quote-callout__field { left: -8%; } }\n</style>`; }\n    function componentCode(s) { const mark = s.hasMark ? '\n      <span class="quote-callout__mark" aria-hidden="true">“</span>' : ''; return `${componentStyles()}\n\n<figure\n  class="quote-callout quote-callout--${s.size} quote-callout--type-${s.type}"\n  style="\n    --quote-field-color: var(${selectedColor.variable});\n    --quote-mark-color: var(${selectedColor.markVariable});\n    --quote-field-width: ${s.fieldWidth}%;\n  "\n>\n  <div class="quote-callout__stage">\n    <div class="quote-callout__field" aria-hidden="true">${mark}\n    </div>\n\n    <div class="quote-callout__content">\n      <blockquote class="quote-callout__quote">\n        ${escapeHtml(s.quote)}\n      </blockquote>\n\n      <div class="quote-callout__divider" aria-hidden="true"></div>\n\n      <figcaption class="quote-callout__meta">\n        ${escapeHtml(s.attribution)}\n      </figcaption>\n    </div>\n  </div>\n</figure>`; }
    */
    function componentCode(s) { const mark = s.hasMark ? '\n      <span class="quote-callout__mark" aria-hidden="true">“</span>' : ''; return `<figure\n  class="quote-callout quote-callout--${s.size} quote-callout--type-${s.type}"\n  style="\n    --quote-field-color: var(${selectedColor.variable});\n    --quote-mark-color: var(${selectedColor.markVariable});\n    --quote-field-width: ${s.fieldWidth}%;\n  "\n>\n  <div class="quote-callout__stage">\n    <div class="quote-callout__field" aria-hidden="true">${mark}\n    </div>\n\n    <div class="quote-callout__content">\n      <blockquote class="quote-callout__quote">\n        ${escapeHtml(s.quote)}\n      </blockquote>\n\n      <div class="quote-callout__divider" aria-hidden="true"></div>\n\n      <figcaption class="quote-callout__meta">\n        ${escapeHtml(s.attribution)}\n      </figcaption>\n    </div>\n  </div>\n</figure>`; }
    function updateFieldHeight(figure) { const content = figure.querySelector('.quote-callout__content'); const multiplier = Number.parseFloat(getComputedStyle(figure).getPropertyValue('--quote-field-height-multiplier')) || 1.5; const height = Math.ceil(content.getBoundingClientRect().height); const fieldHeight = Math.ceil(height * multiplier); figure.style.setProperty('--quote-content-height', `${height}px`); figure.style.setProperty('--quote-field-height', `${fieldHeight}px`); figure.style.setProperty('--quote-stage-height', `${fieldHeight + 12}px`); }
    function render() { const s = state(); const descriptions = { default:'Standard evidence or inline participant quote.', wide:'Major research finding or stronger narrative beat.', hero:'Turning point or quote worth stopping for.' }; document.querySelector('#size-description').textContent = descriptions[s.size]; contentObserver?.disconnect(); preview.replaceChildren(); const figure = document.createElement('figure'); figure.className = `quote-callout quote-callout--${s.size} quote-callout--type-${s.type}${document.querySelector('#show-field-bounds').checked ? ' quote-callout--debug' : ''}`; figure.style.setProperty('--quote-field-color', `var(${selectedColor.variable})`); figure.style.setProperty('--quote-mark-color', `var(${selectedColor.markVariable})`); figure.style.setProperty('--quote-field-width', `${s.fieldWidth}%`); figure.innerHTML = `<div class="quote-callout__stage"><div class="quote-callout__field" aria-hidden="true">${s.hasMark ? '<span class="quote-callout__mark" aria-hidden="true">“</span>' : ''}</div><div class="quote-callout__content"><blockquote class="quote-callout__quote"></blockquote><div class="quote-callout__divider" aria-hidden="true"></div><figcaption class="quote-callout__meta"></figcaption></div></div>`; figure.querySelector('.quote-callout__quote').textContent = s.quote || ' '; figure.querySelector('.quote-callout__meta').textContent = s.attribution; preview.append(figure); updateFieldHeight(figure); contentObserver = new ResizeObserver(() => updateFieldHeight(figure)); contentObserver.observe(figure.querySelector('.quote-callout__content')); output.textContent = componentCode(s); }
    function createSwatches() { swatches.replaceChildren(); colors.forEach(color => { const button = document.createElement('button'); button.type = 'button'; button.className = 'swatch'; button.style.setProperty('--swatch-color', `var(${color.variable})`); button.setAttribute('aria-pressed', String(color === selectedColor)); button.setAttribute('aria-label', `${color.name} background`); button.title = color.name; button.textContent = color.name; button.addEventListener('click', () => { selectedColor = color; createSwatches(); render(); }); swatches.append(button); }); }
    function copy(button, text) { navigator.clipboard.writeText(text).then(() => { const label = button.textContent; button.textContent = 'Copied'; setTimeout(() => button.textContent = label, 1500); }); }
    document.querySelectorAll('input, textarea').forEach(control => control.addEventListener('input', render)); document.querySelectorAll('input[name="size"]').forEach(control => control.addEventListener('input', event => { const defaultType = { default:'xxs', wide:'xs', hero:'s' }[event.currentTarget.value]; document.querySelector(`#type-${defaultType}`).checked = true; render(); })); document.querySelector('#copy-code').addEventListener('click', event => copy(event.currentTarget, output.textContent)); document.querySelector('#copy-text').addEventListener('click', event => { const s = state(); copy(event.currentTarget, `“${s.quote}”\n— ${s.attribution}`); });
    function componentCss() { return [
      '.quote-callout { --quote-field-height:0px; --quote-stage-height:0px; --quote-field-height-multiplier:1.5; --quote-size:var(--type-heading-xs); --quote-line-height:var(--type-heading-xs-line-height); position:relative; isolation:isolate; width:100%; color:var(--color-ink); }',
      '.quote-callout__stage { position:relative; display:grid; align-items:center; min-height:var(--quote-stage-height); font-size:var(--quote-size); }',
      '.quote-callout__field { position:absolute; top:50%; left:50%; width:var(--quote-field-width); height:var(--quote-field-height); transform:translate(-50%,-50%); background:color-mix(in srgb,var(--quote-field-color) 25%,transparent); pointer-events:none; }',
