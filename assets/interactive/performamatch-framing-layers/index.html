<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PerformaMatch problem framing</title><link rel="stylesheet" href="../../../visual-tokens.css"><link rel="stylesheet" href="styles.css?v=semicircle-6"></head>
<body><main class="framing" aria-label="Four layers of problem framing">
  <div class="diagram"><svg viewBox="0 0 1100 550" preserveAspectRatio="xMinYMax meet" role="group" aria-label="Problem framing layers">
    <path class="layer society" data-layer="society" d="M 0 550 A 550 550 0 0 1 1100 550 Z" aria-label="Society" />
    <path class="layer industry" data-layer="industry" d="M 0 550 A 420 420 0 0 1 840 550 Z" aria-label="Industry" />
    <path class="layer human" data-layer="human" d="M 0 550 A 285 285 0 0 1 570 550 Z" aria-label="Human" />
    <path class="layer tool" data-layer="tool" d="M 20 550 A 135 135 0 0 1 290 550 Z" aria-label="Tool" />
    <g class="labels" aria-hidden="true"><text x="155" y="520">TOOL</text><text x="430" y="520">HUMAN</text><text x="705" y="520">INDUSTRY</text><text x="970" y="520">SOCIETY</text></g>
  </svg></div>
  <div class="questions">
    <button class="question tool" data-layer="tool">Can AI actually make casting smarter or easier?</button>
    <button class="question human" data-layer="human">Does it solve something performers value enough to change behavior or pay for?</button>
    <button class="question industry" data-layer="industry">Can better matching create value without enough supply, casting-side participation, credibility, and network effects?</button>
    <button class="question society" data-layer="society">Does it actually change structural barriers around access, cost, bias, visibility, or gatekeeping?</button>
  </div>
</main><script src="script.js?v=semicircle-6"></script></body></html>
